[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fortekaspi-chunking_recall_impact_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列MoE 模型架构师·分块策略对召回的影响的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fortekaspi" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fortekaspi.github.io"
Repository = "https://github.com/fortekaspi/chunking_recall_impact_timeline_score"
Issues = "https://github.com/fortekaspi/chunking_recall_impact_timeline_score/issues"

[project.scripts]
chunking_recall_impact_timeline_score = "chunking_recall_impact_timeline_score:main"

[tool.setuptools]
py-modules = ["chunking_recall_impact_timeline_score"]
